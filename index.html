<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 
    <!-- 홈 화면 웹앱 설정 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DS 재고실사">
    <meta name="theme-color" content="#13111c">
 
    <title>DS 재고실사 프로그램</title>
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
 
    <style>
        :root {
            --ink: #13111c;
            --surface: #1d1a29;
            --surface-2: #272336;
            --surface-3: #312c43;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.16);
            --text: #f6f4f9;
            --muted: #a7a2b8;
            --faint: #6f6a82;
            --coral: #ef5a6f;
            --violet: #8a5ad6;
            --amber: #f6a54a;
            --mint: #4fcfa4;
            --danger: #ff6b7a;
            --brand: linear-gradient(115deg, #ef5a6f 0%, #b24fc0 55%, #8a5ad6 100%);
            --brand-line: linear-gradient(90deg, #ef5a6f, #b24fc0 40%, #8a5ad6 70%, #f6a54a);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
        html { height: 100%; }
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background:
                radial-gradient(120% 60% at 100% 0%, rgba(138, 90, 214, 0.16) 0%, transparent 60%),
                radial-gradient(90% 50% at 0% 0%, rgba(239, 90, 111, 0.12) 0%, transparent 55%),
                var(--ink);
            color: var(--text);
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 15px;
            letter-spacing: -0.01em;
            padding-top: env(safe-area-inset-top, 0px);
            font-feature-settings: "tnum";
        }
 
        button { font-family: inherit; cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
 
        /* ---------- 헤더 ---------- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 16px 7px;
            position: relative;
        }
        header::after {
            content: "";
            position: absolute;
            left: 16px; right: 16px; bottom: 0;
            height: 1px;
            background: var(--brand-line);
            opacity: .55;
        }
        .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .brand-logo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #fff; padding: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
        .brand-text { display: flex; flex-direction: column; min-width: 0; }
        .brand-name { font-size: .96rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
        .brand-name b { background: var(--brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .brand-sub { font-size: .68rem; color: var(--muted); margin-top: 1px; white-space: nowrap; }
 
        .btn-inspector {
            display: inline-flex; align-items: center; gap: 7px;
            max-width: 130px; height: 34px; flex-shrink: 0; align-self: center; line-height: 1;
            padding: 0 12px 0 4px;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--text);
            font-size: .84rem; font-weight: 700;
        }
        .btn-inspector .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); font-size: .8rem; font-weight: 900; color: #fff; flex-shrink: 0; }
        .btn-inspector .ins-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-inspector.no-name { border-color: rgba(246,165,74,.6); color: var(--amber); }
        .btn-inspector.no-name .avatar { background: rgba(246,165,74,.18); color: var(--amber); }
 
        /* ---------- 본문 ---------- */
        main { flex: 1; overflow-y: auto; padding: 10px 16px 10px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
 
        /* 스캐너 */
        .scanner {
            position: relative;
            height: 244px;
            flex-shrink: 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: radial-gradient(80% 90% at 50% 40%, #221e31 0%, #0d0b14 100%);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }
        .scanner video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
        .scanner.is-live video { opacity: 1; }
 
        .frame { position: absolute; left: 50%; top: 50%; width: 86%; height: 52%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
        .scanner.is-live .frame { display: block; }
        .frame i { position: absolute; width: 26px; height: 26px; border-color: #fff; border-style: solid; opacity: .9; }
        .frame i:nth-child(1) { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 10px; }
        .frame i:nth-child(2) { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 10px; }
        .frame i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 10px; }
        .frame i:nth-child(4) { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 10px; }
        .frame .laser { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; border-radius: 2px; background: var(--brand-line); box-shadow: 0 0 14px rgba(239,90,111,.8); opacity: 0; }
        .scanner.is-live .frame .laser { opacity: 1; animation: sweep 1.8s ease-in-out infinite; }
        @keyframes sweep { 0%,100% { transform: translateY(-38px); } 50% { transform: translateY(38px); } }
 
        .scan-idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 20px; }
        .scan-idle .glyph { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
        .scan-idle strong { font-size: 1.02rem; }
        .scan-idle span { font-size: .82rem; color: var(--muted); }
        .scanner.is-live .scan-idle,
        .scanner.no-camera .scan-idle,
        .scanner.no-camera .frame { display: none; }
 
        .scan-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: .8rem; font-weight: 700; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.8); display: none; }
        .scanner.is-live .scan-hint { display: block; }
 
        .camera-fallback { display: none; position: relative; flex-direction: column; align-items: center; text-align: center; gap: 9px; padding: 22px 18px; }
        .scanner.no-camera { height: auto; min-height: 244px; }
        .scanner.no-camera video { display: none; }
        .scanner.no-camera .camera-fallback { display: flex; }
        .camera-fallback .warn { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(246,165,74,.14); color: var(--amber); font-weight: 900; font-size: 1.2rem; }
        .camera-fallback strong { font-size: 1.05rem; }
        .camera-fallback > span { font-size: .84rem; color: var(--muted); line-height: 1.55; word-break: keep-all; }
        .fallback-actions { display: grid; gap: 8px; width: 100%; margin-top: 6px; }
        .fallback-steps { font-size: .74rem !important; color: var(--faint) !important; }
 
        /* 버튼 */
        .btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: none; border-radius: var(--radius-md); font-weight: 800; letter-spacing: -0.01em; transition: transform .12s, opacity .2s, background .2s; }
        .btn:active { transform: scale(.985); }
        .btn:disabled { opacity: .5; }
        .btn-primary { min-height: 60px; font-size: 1.12rem; color: #fff; background: var(--brand); box-shadow: 0 12px 30px rgba(178, 79, 192, .35); }
        .btn-primary.scanning { background: var(--surface-3); box-shadow: none; border: 1px solid var(--line-strong); }
        .btn-secondary { min-height: 52px; font-size: .98rem; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); }
        .btn-ghost { min-height: 46px; font-size: .9rem; color: var(--muted); background: transparent; border: 1px solid var(--line); }
        .btn-danger { min-height: 56px; font-size: 1.02rem; color: #fff; background: #d9475a; }
        .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
 
        .action-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
        #btn-toggle-scan { min-height: 50px; font-size: 1.06rem; }
 
        /* 요약 */
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); }
        .summary > div { padding: 7px 8px 6px; text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
        .summary > div + div { border-left: 1px solid var(--line); }
        .summary .label { font-size: .72rem; color: var(--muted); }
        .summary .value { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.02em; }
        .summary .value small { font-size: .74rem; color: var(--muted); font-weight: 600; margin-left: 2px; }
        .summary .state { font-size: .82rem; font-weight: 800; }
 
        /* 목록 */
        .list-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; padding: 0 2px; flex-shrink: 0; }
        .list-head h2 { font-size: 1rem; font-weight: 800; }
        .list-head span { font-size: .76rem; color: var(--muted); }
 
        .list { display: flex; flex-direction: column; gap: 8px; flex: 1 0 auto; }
        .list .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        /* 화면이 충분히 긴 폰: 위쪽은 고정, 목록만 스크롤 → 목록이 하단 버튼까지 꽉 차게 */
        @media (min-height: 700px) {
            main { overflow: hidden; }
            .list { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
            .scanner, .action-row, .summary { flex-shrink: 0; }
        }
        .item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 12px;
            padding: 12px 14px 10px;
            border-radius: var(--radius-md);
            background: var(--surface);
            border: 1px solid var(--line);
            animation: itemIn .25s ease-out;
        }
        @keyframes itemIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .item-main { min-width: 0; cursor: pointer; }
        .item-name { font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-code { font-size: .78rem; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .code-chip { display: inline-block; padding: 2px 7px; border-radius: 6px; background: rgba(138,90,214,.18); color: #cdb6ff; font-size: .74rem; font-weight: 800; letter-spacing: .01em; }
        .code-chip.unknown { background: rgba(246,165,74,.15); color: var(--amber); }
        .tag.box { background: rgba(138,90,214,.18); color: #cdb6ff; font-weight: 700; }
        .item-qty { text-align: right; cursor: pointer; }
        .item-qty strong { display: block; font-size: 1.6rem; font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
        .item-qty span { font-size: .7rem; color: var(--muted); }
        .item-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 8px; background: var(--surface-2); font-size: .76rem; color: var(--muted); }
        .tag b { color: var(--text); font-weight: 700; }
        .tag.warn { background: rgba(246,165,74,.14); color: var(--amber); }
        .tag.expired { background: rgba(255,107,122,.14); color: var(--danger); }
        .item-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
        .item-actions button { min-height: 36px; border-radius: 10px; font-size: .86rem; font-weight: 700; background: var(--surface-2); color: var(--text); border: none; }
        .item-actions .btn-delete { color: var(--danger); }
 
        .empty { text-align: center; padding: 34px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--muted); font-size: .86rem; line-height: 1.7; word-break: keep-all; }
        .empty strong { display: block; color: var(--text); font-size: .98rem; margin-bottom: 4px; }
 
        /* 하단 전송 바 */
        footer { padding: 6px 16px max(6px, calc(env(safe-area-inset-bottom, 0px) - 24px)); background: rgba(19, 17, 28, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
        .btn-send { min-height: 52px; font-size: 1.08rem; color: #fff; background: var(--brand); box-shadow: 0 10px 28px rgba(178, 79, 192, .3); }
        .btn-send .count { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: .86rem; display: inline-grid; place-items: center; }
        .btn-send.is-empty { background: var(--surface-2); color: var(--muted); box-shadow: none; }
        .btn-send.is-empty .count { background: var(--surface-3); }
 
        /* ---------- 바텀 시트 ---------- */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(6, 5, 10, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .sheet {
            width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--line-strong); border-bottom: none;
            border-radius: 26px 26px 0 0;
            padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -30px 80px rgba(0,0,0,.5);
            animation: slideUp .32s cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
        .sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--surface-3); margin: 0 auto 16px; }
        .sheet h3 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; word-break: keep-all; }
        .sheet .sheet-sub { font-size: .86rem; color: var(--muted); margin-top: 4px; margin-bottom: 18px; line-height: 1.5; word-break: keep-all; }
 
        .field { margin-bottom: 14px; }
        .field label, .field .label { display: flex; align-items: center; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
        .field input {
            width: 100%; height: 52px; padding: 0 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line-strong);
            background: var(--ink);
            color: var(--text);
            font-family: inherit; font-size: 1.05rem; font-weight: 600;
            outline: none; transition: border-color .15s;
        }
        .field input:focus { border-color: var(--violet); }
        .field input::placeholder { color: var(--faint); font-weight: 500; }
        .field.invalid input { border-color: var(--danger); animation: shake .3s; }
        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 
        .with-action { position: relative; }
        .with-action input { padding-right: 58px; }
        .with-action .btn-ocr { position: absolute; right: 6px; top: 6px; width: 44px; height: 40px; border-radius: 10px; border: none; background: var(--surface-2); color: var(--text); display: grid; place-items: center; }
        .with-action .btn-ocr svg { width: 20px; height: 20px; }
 
        .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
        .stepper button { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-size: 1.6rem; font-weight: 500; }
        .stepper input { height: 64px; text-align: center; font-size: 1.9rem; font-weight: 900; letter-spacing: -0.03em; border-color: rgba(138,90,214,.6); }
 
        .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; }
        .sheet-actions .btn { min-height: 56px; }
 
        .confirm-box { background: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 4px 16px; margin-bottom: 4px; }
        .confirm-box div { display: flex; justify-content: space-between; padding: 12px 0; font-size: .92rem; }
        .confirm-box div + div { border-top: 1px solid var(--line); }
        .confirm-box span { color: var(--muted); }
        .confirm-box b { font-weight: 800; }
 
        /* ---------- 날짜 OCR 화면 ---------- */
        .ocr-modal-overlay { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 2000; padding-top: env(safe-area-inset-top, 0px); }
        .ocr-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
        .ocr-header h4 { font-size: 1.05rem; font-weight: 800; }
        .ocr-close { width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.1); color: #fff; font-size: 1.1rem; }
        .ocr-camera-box { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #0d0b14; }
        .ocr-video { width: 100%; height: 100%; object-fit: cover; }
        .ocr-guide-box { position: absolute; width: 86%; max-width: 340px; height: 112px; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 12px; font-size: .9rem; font-weight: 700; line-height: 1.5; pointer-events: none; }
        .ocr-guide-line { position: absolute; left: 6%; right: 6%; height: 2px; background: var(--brand-line); box-shadow: 0 0 12px rgba(239,90,111,.8); animation: scanMove 1.5s infinite ease-in-out; }
        @keyframes scanMove { 0% { top: 12%; opacity: .3; } 50% { opacity: 1; } 100% { top: 88%; opacity: .3; } }
        .ocr-footer { padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
        #ocr-canvas { display: none; }
 
        /* ---------- 알림 ---------- */
        .notice-stack { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; z-index: 3000; display: grid; gap: 8px; pointer-events: none; }
        .notice { max-width: 456px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 30px 1fr auto; gap: 11px; align-items: start; padding: 13px 14px; border-radius: 16px; background: rgba(39, 35, 54, .96); border: 1px solid var(--line-strong); box-shadow: 0 18px 50px rgba(0,0,0,.5); backdrop-filter: blur(12px); pointer-events: auto; animation: noticeIn .28s cubic-bezier(.2,.8,.2,1); }
        .notice-icon { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; background: rgba(246,165,74,.16); color: var(--amber); }
        .notice.success .notice-icon { background: rgba(79,207,164,.16); color: var(--mint); }
        .notice-copy strong { display: block; font-size: .92rem; margin: 1px 0 3px; }
        .notice-copy span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.45; word-break: keep-all; white-space: pre-line; }
        .notice-close { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 2px 4px; }
        @keyframes noticeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
 
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div id="notice-stack" class="notice-stack" aria-live="polite" aria-atomic="true"></div>

    <canvas id="ocr-canvas"></canvas>
    <script>
        // =====================================================================
        // 구글 Apps Script 웹앱 배포 URL
        // =====================================================================
        const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbzvULYzVEjx9CD8fwxgfY-hj0vQAZ98jAoK8izzjpm7uQCAU9SCqZOGAWMC3LYQAeI1/exec';
 
        const STORE_KEY = 'ds_pending_records_v2';     // 전송 전 데이터 (이 휴대폰에만 보관)
        const INSPECTOR_KEY = 'ds_inspector_name';
        const AUTOSTART_KEY = 'ds_autostart_scan';
        const EXPIRY_WARN_DAYS = 30;                   // 소비기한 임박 표시 기준(일)
 
        const MASTER_KEY = 'ds_master_cache_v1';        // 자재 마스터 (구글 시트 '마스터' 시트에서 받아옴)
        let masterMap = new Map();
        let masterCount = 0;
        let currentProduct = null;                      // 등록 시트에 표시 중인 마스터 제품
 
        let scanDataList = [];
        let isScanning = false;
        let isProcessingScan = false;
        let cameraUnavailable = false;
        let editingId = null;
        let resumeScanAfterModal = false;
        let sendAfterInspector = false;
        let isSending = false;
 
        let ocrTargetInputId = "";
        let ocrStream = null;
        let isOcrLoopActive = false;
        let ocrWorkerPromise = null;
 
        const $ = (id) => document.getElementById(id);
        const scannerCard = $('scanner-card');
        const btnToggleScan = $('btn-toggle-scan');
        const modalOverlay = $('modal-overlay');
        const modalItemName = $('modal-item-name');
        const modalBarcode = $('modal-barcode');
        const inputBarcode = $('input-barcode');
        const inputName = $('input-name');
        const inputQty = $('input-qty');
        const inputExp = $('input-exp');
        const inputUse = $('input-use');
        const btnSave = $('btn-save');
        const btnCancel = $('btn-cancel');
        const btnSend = $('btn-send');
        const btnManual = $('btn-manual');
        const btnInspector = $('btn-inspector');
        const inspectorOverlay = $('inspector-overlay');
        const inputInspector = $('input-inspector');
        const photoBarcode = $('photo-barcode');
        const photoDate = $('photo-date');
        const btnCapture = $('btn-capture-manual');
        const ocrStatusText = $('ocr-status-text');
 
        // ------------------------------------------------------------------
        // 공통
        // ------------------------------------------------------------------
        function showNotice(title, message, type = 'warning', duration = 5000) {
            const stack = $('notice-stack');
            const notice = document.createElement('div');
            notice.className = `notice ${type}`;
            notice.innerHTML = `<div class="notice-icon" aria-hidden="true">${type === 'success' ? '&#10003;' : '!'}</div><div class="notice-copy"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span></div><button type="button" class="notice-close" aria-label="알림 닫기">&times;</button>`;
            const remove = () => notice.remove();
            notice.querySelector('.notice-close').addEventListener('click', remove);
            stack.appendChild(notice);
            while (stack.children.length > 3) stack.firstElementChild.remove();
            if (duration) setTimeout(remove, duration);
        }
 
        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = String(value ?? '');
            return node.innerHTML;
        }
 
        function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
 
        function markInvalid(fieldId, focusEl) {
            const f = $(fieldId);
            f.classList.remove('invalid'); void f.offsetWidth; f.classList.add('invalid');
            setTimeout(() => f.classList.remove('invalid'), 1200);
            if (focusEl) focusEl.focus();
        }
 
        // ------------------------------------------------------------------
        // 자재 마스터: 제품바코드(C열)·박스바코드(D열) 모두로 제품코드/제품명 조회
        // ------------------------------------------------------------------
        function barcodeKey(b) {
            return String(b || '').replace(/\D/g, '').replace(/^0+/, '');
        }
 
        function buildMaster(items) {
            masterMap = new Map();
            (items || []).forEach(it => {
                if (it.unitBarcode) masterMap.set(barcodeKey(it.unitBarcode), { ...it, type: '낱개' });
                if (it.boxBarcode) masterMap.set(barcodeKey(it.boxBarcode), { ...it, type: '박스' });
            });
            masterCount = (items || []).length;
        }
 
        function lookupProduct(barcode) {
            const k = barcodeKey(barcode);
            return k ? (masterMap.get(k) || null) : null;
        }
 
        // 전송 전 목록 중 '미등록 제품'이었던 항목을 최신 마스터로 채움
        function backfillFromMaster() {
            let changed = false;
            scanDataList.forEach(item => {
                const p = lookupProduct(item.barcode);
                if (!p) return;
                if (!item.code) { item.code = p.code; changed = true; }
                if (!item.barcodeType) { item.barcodeType = p.type; changed = true; }
                if (!item.name || item.name === '미등록 제품') { item.name = p.name; changed = true; }
            });
            if (changed) { saveLocal(); renderList(); }
        }
 
        async function loadMaster() {
            try {
                const cached = JSON.parse(localStorage.getItem(MASTER_KEY) || 'null');
                if (cached && cached.items) buildMaster(cached.items);
            } catch {}
            if (!SHEET_API_URL) return;
            try {
                const res = await fetch(`${SHEET_API_URL}?action=master`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.error);
                buildMaster(data.items);
                try { localStorage.setItem(MASTER_KEY, JSON.stringify({ items: data.items, updatedAt: data.updatedAt })); } catch {}
                backfillFromMaster();
            } catch (e) {
                if (!masterCount) showNotice('자재 마스터를 불러오지 못했어요', '인터넷 연결을 확인해 주세요. 스캔은 가능하지만 제품명이 \'미등록 제품\'으로 표시됩니다.');
            }
            refreshStatus();
        }
 
        function productInfoHtml(p, barcode) {
            if (!p) return `<span class="code-chip unknown">미등록</span> 바코드 ${escapeHtml(barcode)}`;
            const box = p.type === '박스' ? `박스 바코드${p.perBox ? ` · 입수 ${escapeHtml(p.perBox)}` : ''}` : '제품 바코드';
            return `<span class="code-chip">${escapeHtml(p.code)}</span> ${box}`;
        }
 
        // 확인 시트 (native confirm 대체)
        function askConfirm({ title, message = '', rows = [], confirmText = '확인', danger = false }) {
            return new Promise(resolve => {
                $('confirm-title').innerText = title;
                $('confirm-msg').innerText = message;
                const box = $('confirm-box');
                box.innerHTML = rows.map(([k, v]) => `<div><span>${escapeHtml(k)}</span><b>${escapeHtml(v)}</b></div>`).join('');
                box.style.display = rows.length ? '' : 'none';
                const yes = $('confirm-yes'), no = $('confirm-no');
                yes.innerText = confirmText;
                yes.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
                $('confirm-overlay').style.display = 'flex';
                const done = (v) => { $('confirm-overlay').style.display = 'none'; yes.onclick = no.onclick = null; resolve(v); };
                yes.onclick = () => done(true);
                no.onclick = () => done(false);
            });
        }
 
        // 시트 바깥(어두운 영역) 누르면 닫기
        [['modal-overlay', () => closeModal()], ['inspector-overlay', () => { inspectorOverlay.style.display = 'none'; sendAfterInspector = false; }], ['confirm-overlay', () => $('confirm-no').click()]]
            .forEach(([id, fn]) => $(id).addEventListener('click', (e) => { if (e.target.id === id) fn(); }));
 
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.ITF,
            ZXing.BarcodeFormat.CODE_128
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        // ------------------------------------------------------------------
        // 고속 바코드 엔진 (무료): ① 기기 내장 인식기 → ② ZXing-C++ WebAssembly → ③ ZXing JS
        // ------------------------------------------------------------------
        const WASM_FORMATS = ['EAN-13', 'ITF', 'Code128'];
        const jsReader = new ZXing.MultiFormatReader();
        jsReader.setHints(hints);
        let scanEngine = null;
        let nativeDetector = null;
        let scanStream = null;
        let scanRaf = 0;
        let scanBusy = false;
        const roiCanvas = document.createElement('canvas');
        const roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });
 
        // 앱 시작 시 WebAssembly 엔진을 미리 받아둠 → 첫 스캔부터 빠르게
        try { if (window.ZXingWASM) ZXingWASM.prepareZXingModule({ fireImmediately: true }).catch(() => {}); } catch {}
 
        async function initScanEngine() {
            if (scanEngine) return scanEngine;
            try {
                if ('BarcodeDetector' in window) {
                    const sup = await BarcodeDetector.getSupportedFormats();
                    if (sup.includes('ean_13')) {
                        nativeDetector = new BarcodeDetector({ formats: ['ean_13', 'itf', 'code_128'].filter(f => sup.includes(f)) });
                        return (scanEngine = 'native');
                    }
                }
            } catch {}
            if (window.ZXingWASM && ZXingWASM.readBarcodes) return (scanEngine = 'wasm');
            return (scanEngine = 'js');
        }
 
        // 영상/사진에서 가운데 영역만 잘라 빠르게 인식
        async function decodeImage(source, w, h, { roi = true, maxWidth = 1280 } = {}) {
            let sx = 0, sy = 0, sw = w, sh = h;
            if (roi) { sw = Math.round(w * 0.92); sh = Math.round(h * 0.6); sx = Math.round((w - sw) / 2); sy = Math.round((h - sh) / 2); }
            const scale = Math.min(1, maxWidth / sw);
            roiCanvas.width = Math.round(sw * scale);
            roiCanvas.height = Math.round(sh * scale);
            roiCtx.drawImage(source, sx, sy, sw, sh, 0, 0, roiCanvas.width, roiCanvas.height);
 
            if (scanEngine === 'native') {
                try {
                    const found = await nativeDetector.detect(roiCanvas);
                    if (found.length) return found[0].rawValue;
                } catch { scanEngine = window.ZXingWASM ? 'wasm' : 'js'; }
                if (scanEngine === 'native') return null;
            }
            if (scanEngine === 'wasm') {
                try {
                    const img = roiCtx.getImageData(0, 0, roiCanvas.width, roiCanvas.height);
                    const res = await ZXingWASM.readBarcodes(img, { formats: WASM_FORMATS, tryHarder: true, maxNumberOfSymbols: 1 });
                    const hit = res.find(r => r.isValid && r.text);
                    return hit ? hit.text : null;
                } catch { scanEngine = 'js'; }
            }
            try {
                const lum = new ZXing.HTMLCanvasElementLuminanceSource(roiCanvas);
                return jsReader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)), hints).getText();
            } catch { return null; }
        }
 
        // ------------------------------------------------------------------
        // 날짜 입력 자동 정리 (20260902 → 2026.09.02)
        // ------------------------------------------------------------------
        function normalizeDate(v) {
            const raw = String(v || '').trim();
            if (!raw) return '';
            const d = raw.replace(/[^\d]/g, '');
            if (d.length === 8) return `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
            if (d.length === 6) return `20${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4,6)}`;
            const m = raw.match(/^(\d{2,4})[.\-\/\s](\d{1,2})[.\-\/\s](\d{1,2})$/);
            if (m) {
                const y = m[1].length === 2 ? '20' + m[1] : m[1];
                return `${y}.${m[2].padStart(2, '0')}.${m[3].padStart(2, '0')}`;
            }
            return raw;
        }
        document.querySelectorAll('.date-input').forEach(el => el.addEventListener('blur', () => { el.value = normalizeDate(el.value); }));
 
        function daysUntil(dateStr) {
            const m = String(dateStr || '').match(/^(\d{4})\.(\d{2})\.(\d{2})$/);
            if (!m) return null;
            const target = new Date(+m[1], +m[2] - 1, +m[3]);
            const today = new Date(); today.setHours(0, 0, 0, 0);
            return Math.round((target - today) / 86400000);
        }
 
        // ------------------------------------------------------------------
        // 수량 스테퍼
        // ------------------------------------------------------------------
        $('qty-minus').addEventListener('click', () => { inputQty.value = Math.max(0, (parseInt(inputQty.value, 10) || 0) - 1); vibrate(15); });
        $('qty-plus').addEventListener('click', () => { inputQty.value = (parseInt(inputQty.value, 10) || 0) + 1; vibrate(15); });
 
        // ------------------------------------------------------------------
        // 재고실사자
        // ------------------------------------------------------------------
        function getInspector() {
            try { return (localStorage.getItem(INSPECTOR_KEY) || '').trim(); } catch { return ''; }
        }
 
        function renderInspector() {
            const name = getInspector();
            btnInspector.querySelector('.ins-name').innerText = name || '실사자 입력';
            btnInspector.querySelector('.avatar').innerText = name ? name.charAt(0) : '?';
            btnInspector.classList.toggle("no-name", !name);
        }
 
        function openInspectorModal(thenSend = false) {
            sendAfterInspector = thenSend;
            inputInspector.value = getInspector();
            inspectorOverlay.style.display = 'flex';
            setTimeout(() => inputInspector.focus(), 200);
        }

            return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        }
 
        function showCameraFallback(err) {
            const noApi = !window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
            let title, msg;
            if (noApi) {
                title = '이 화면에서는 실시간 카메라를 쓸 수 없어요';
                msg = 'Safari에서 웹앱 주소로 열어 주세요. 지금은 아래 [사진 찍어서 스캔]으로 바로 스캔할 수 있어요.';
            } else if (isDenied(err)) {
                title = '카메라가 차단되어 있습니다';

            }
            $('fallback-title').innerText = title;

                : '그래도 안 뜨면: 주소창 왼쪽 aA → 웹 사이트 설정 → 카메라 → 허용';
            $('btn-retry-camera').style.display = noApi ? 'none' : '';
            cameraUnavailable = true;
            scannerCard.classList.add('no-camera');

        function setScanButton(scanning) {

        btnToggleScan.addEventListener('click', () => {

        function onDecode(text) {
            if (text && !isProcessingScan) {
                isProcessingScan = true;
                stopScan();
                vibrate(80);
                handleScanSuccess(text);
            }
        }
 
        async function startScan() {
            if (isScanning) return;
            if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showCameraFallback(null);
                return;
            }
            hideCameraFallback();
            isScanning = true;
            isProcessingScan = false;
            setScanButton(true);
 
            let stream;
            try {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }
                    });
                } catch (e) {
                    if (isDenied(e)) throw e;
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                }
            } catch (err) {
                stopScan();
                showCameraFallback(err);
                return;
            }
 
            if (!isScanning) { stream.getTracks().forEach(t => t.stop()); return; }
 
            scanStream = stream;
            const video = $('video');
            video.srcObject = stream;
            try { await video.play(); } catch {}
 
            // 자동 초점 연속 모드 (지원 기기만)
            try {
                const track = stream.getVideoTracks()[0];
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
            } catch {}
 
            await initScanEngine();
            scanLoop();
        }
 
        // 매 프레임마다 인식 (이전 인식이 끝나면 즉시 다음 프레임)
        function scanLoop() {
            if (!isScanning) return;
            const video = $('video');
            if (!scanBusy && video.readyState >= 2 && video.videoWidth) {
                scanBusy = true;
                decodeImage(video, video.videoWidth, video.videoHeight)
                    .then(text => { scanBusy = false; if (text && isScanning) onDecode(text); })
                    .catch(() => { scanBusy = false; });
            }
            scanRaf = requestAnimationFrame(scanLoop);
        }
 
        function stopScan() {
            isScanning = false;
            cancelAnimationFrame(scanRaf);
            scanBusy = false;

            $('video').srcObject = null;
            setScanButton(false);
        }
 
        function fileToCanvas(file, maxSize = 1800) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.naturalWidth * scale);
                    canvas.height = Math.round(img.naturalHeight * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 불러오지 못했습니다')); };
                img.src = url;
            });
        }

                await initScanEngine();
                const text = await decodeImage(canvas, canvas.width, canvas.height, { roi: false, maxWidth: 1800 });
                if (!text) throw new Error('not found');
                vibrate(80);
                handleScanSuccess(text);

                showNotice('바코드를 찾지 못했어요', '바코드가 사진 가운데에 크고 선명하게 나오도록 다시 찍거나, [바코드 직접 입력]을 눌러 주세요.');

        // ------------------------------------------------------------------
        // 날짜 OCR (실시간 → 안 되면 사진 촬영)

        function ensureOcrWorker() {
            if (!ocrWorkerPromise) {
                ocrWorkerPromise = Tesseract.createWorker('eng+kor').catch(err => { ocrWorkerPromise = null; throw err; });
            }
            return ocrWorkerPromise;
        }
 
        function setOcrPhotoMode() {
            ocrStatusText.innerHTML = "실시간 카메라를 쓸 수 없어요<br>아래 버튼으로 날짜를 사진으로 찍어 주세요";
            btnCapture.innerText = "사진 찍어서 날짜 인식";

        async function openAutoOcrCamera(inputId, labelTitle) {
            ocrTargetInputId = inputId;
            $('ocr-title-text').innerText = labelTitle + " 촬영";
            ocrStatusText.innerHTML = "네모 안에 날짜를 맞추세요<br>(자동 감지 중)";
            btnCapture.innerText = "지금 화면으로 인식하기";
            btnCapture.disabled = false;
            $('ocr-modal-overlay').style.display = 'flex';
            ensureOcrWorker().catch(() => {});
 
            try {
                if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-camera');
                try {
                    ocrStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: "environment" }, width: { min: 1280, ideal: 1920 }, height: { min: 720, ideal: 1080 } }
                    });
                } catch (e) {
                    if (isDenied(e)) throw e;
                    ocrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                }
            } catch (err) {
                ocrStream = null;
                setOcrPhotoMode();
                return;
            }
 
            const ocrVideo = $('ocr-video');
            ocrVideo.srcObject = ocrStream;
            try { await ocrVideo.play(); } catch (e) {}
 
            try {
                await ensureOcrWorker();
            } catch (e) {
                ocrStatusText.innerHTML = "인식 엔진을 불러오지 못했어요<br>인터넷 연결 후 다시 시도하거나 직접 입력해 주세요";
                return;

            isOcrLoopActive = true;
            runOcrAutoLoop();
        }

            $('ocr-modal-overlay').style.display = 'none';

        function parseDateFromText(rawText) {
            let match = rawText.match(/20\d{2}[\.\-\/]\d{1,2}[\.\-\/]\d{1,2}/);
            if (match) return normalizeDate(match[0]);
            match = rawText.match(/\d{2}[\.\-\/]\d{1,2}[\.\-\/]\d{1,2}/);
            if (match) return normalizeDate(match[0]);
            const digitsOnly = rawText.replace(/[^\d]/g, '');
            const match8 = digitsOnly.match(/20\d{6}/);
            if (match8) return normalizeDate(match8[0]);
            return null;
        }
 
        function prepareCroppedCanvas() {
            const ocrVideo = $('ocr-video');
            const canvas = $('ocr-canvas');
            const fullWidth = ocrVideo.videoWidth || 1280;
            const fullHeight = ocrVideo.videoHeight || 720;
            const cropWidth = fullWidth * 0.85;
            const cropHeight = fullHeight * 0.30;
            const cropX = (fullWidth - cropWidth) / 2;
            const cropY = (fullHeight - cropHeight) / 2;
            canvas.width = cropWidth;
            canvas.height = cropHeight;
            canvas.getContext('2d').drawImage(ocrVideo, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            return canvas;
        }

        }

            const worker = await ensureOcrWorker();
            while (isOcrLoopActive) {

                try {
                    const ret = await worker.recognize(prepareCroppedCanvas());
                    const cleanDate = parseDateFromText(ret.data.text);
                    if (cleanDate && isOcrLoopActive) { applyOcrDate(cleanDate); break; }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 400));
            }
        }

                    applyOcrDate(cleanDate);

                    ocrStatusText.innerText = "네모 안에 날짜를 맞추세요";
                    isOcrLoopActive = true;
                    runOcrAutoLoop();
                }
            } catch (e) {
                showNotice('인식 중 오류가 발생했어요', '날짜를 직접 입력해 주세요.');

        function formatTime(value) {

            if (days <= EXPIRY_WARN_DAYS) return `<span class="tag warn">소비 <b>${escapeHtml(useDate)}</b> D-${days}</span>`;
            return `<span class="tag">소비 <b>${escapeHtml(useDate)}</b></span>`;

                        ${item.barcodeType === '박스' ? '<span class="tag box">박스</span>' : ''}
                        <span class="tag">제조 <b>${escapeHtml(item.expDate)}</b></span>
                        ${expiryTag(item.useDate)}
                    </div>
                    <div class="item-actions">
                        <button type="button" data-action="edit">수정</button>
                        <button type="button" class="btn-delete" data-action="delete">삭제</button>
                    </div>
                </article>
            `).join('');
        }
 
        $('inventory-list').addEventListener('click', async (event) => {
            const actionEl = event.target.closest('[data-action]');
            const card = event.target.closest('.item');
            if (!actionEl || !card) return;
            const item = scanDataList.find(r => r.id === card.dataset.recordId);
            if (!item) return;
 
            if (actionEl.dataset.action === 'delete') {
                const ok = await askConfirm({
                    title: '이 기록을 삭제할까요?',
                    rows: [['제품', item.name], ['바코드', item.barcode], ['수량', item.qty + '개']],
                    confirmText: '삭제',
                    danger: true
                });
                if (!ok) return;
                scanDataList = scanDataList.filter(r => r.id !== item.id);
                saveLocal();
                renderList();
                showNotice('삭제 완료', '전송 대기 목록에서 삭제했습니다.', 'success', 2000);
            } else {
                stopScan();
                openItemModal({ mode: 'edit', item });
            }
        });
 
        // ------------------------------------------------------------------
        // 대시보드 전송 → 구글 시트 저장 후 화면에서 제거
        // ------------------------------------------------------------------
        async function callApi(payload) {
            // Content-Type을 지정하지 않아야(text/plain) Apps Script CORS 문제가 생기지 않습니다
            const res = await fetch(SHEET_API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '시트 저장 실패');
            return data;
        }
 
        function setSending(on) {
            isSending = on;
            btnSend.disabled = on;
            btnSend.querySelector('.label').innerText = on ? '전송 중...' : '대시보드 전송';
        }
 
        async function sendToDashboard() {
            if (isSending) return;
            if (!scanDataList.length) {
                showNotice('전송할 데이터가 없어요', '먼저 바코드를 스캔해 실사 내역을 추가해 주세요.');
                return;
            }
            const inspector = getInspector();
            if (!inspector) {
                openInspectorModal(true);
                return;
            }
            if (!SHEET_API_URL) {
                showNotice('구글 시트 연결 설정 필요', '관리자에게 시트 연결 설정을 요청해 주세요. 데이터는 휴대폰에 그대로 보관됩니다.');
                return;
            }
            const totalQty = scanDataList.reduce((s, r) => s + (Number(r.qty) || 0), 0);
            const ok = await askConfirm({
                title: '대시보드로 전송할까요?',
                message: '전송 후에는 이 화면에서 조회·수정할 수 없어요.',
                rows: [['재고실사자', inspector], ['전송 건수', scanDataList.length + '건'], ['총 수량', totalQty.toLocaleString('ko-KR') + '개']],
                confirmText: '전송하기'
            });
            if (!ok) return;
 
            stopScan();
            setSending(true);
            const toSend = [...scanDataList];
            let sentCount = 0;
            try {
                for (let i = 0; i < toSend.length; i += 100) {
                    const chunk = toSend.slice(i, i + 100);
                    await callApi({
                        action: 'submit',
                        inspector,
                        records: chunk.map(item => ({
                            id: item.id,
                            scannedAt: item.scannedAt,
                            barcode: item.barcode,
                            productName: item.name,
                            quantity: item.qty,
                            manufactureDate: item.expDate === '-' ? '' : item.expDate,
                            expiryDate: item.useDate === '-' ? '' : item.useDate,
                            productCode: item.code || '',
                            barcodeType: item.barcodeType || ''
                        }))
                    });
                    const sentIds = new Set(chunk.map(r => r.id));
                    scanDataList = scanDataList.filter(r => !sentIds.has(r.id));
                    sentCount += chunk.length;
                    saveLocal();
                    renderList();
                }
                vibrate([60, 40, 60]);
                showNotice('전송 완료', `${sentCount}건이 구글 시트에 저장되었습니다.`, 'success', 4000);
            } catch (error) {
                showNotice('전송하지 못했어요', `${sentCount ? sentCount + '건은 전송됐고, ' : ''}남은 데이터는 휴대폰에 그대로 있어요.\n인터넷 연결을 확인하고 다시 눌러 주세요.`, 'warning', 8000);
            } finally {
                setSending(false);
            }
        }
 
        btnSend.addEventListener('click', sendToDashboard);
        window.addEventListener('online', refreshStatus);
        window.addEventListener('offline', refreshStatus);
 
        // ------------------------------------------------------------------
        // 시작
        // ------------------------------------------------------------------
        scanDataList = loadLocal();
        renderInspector();
        renderList();
        loadMaster();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) loadMaster(); });
 
        try {
            if (sessionStorage.getItem(AUTOSTART_KEY)) {
                sessionStorage.removeItem(AUTOSTART_KEY);
                startScan();
            }
        } catch {}
    </script>
</body>
</html>
